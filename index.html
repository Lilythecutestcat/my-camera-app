```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Camera</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  h2 { padding: 12px; }

  video {
    width: 100%;
    max-height: 70vh;
    object-fit: cover;
    background: #222;
  }

  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    padding: 20px;
  }

  button {
    padding: 14px 20px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    background: #333;
    color: white;
  }

  .shutter {
    width: 75px;
    height: 75px;
    border: 5px solid white;
    background: #f33;
    border-radius: 50%;
    padding: 0;
  }

  #gallery {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    padding: 15px;
  }

  #gallery img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 8px;
  }
</style>
</head>
<body>

<h2>📸 My Camera</h2>

<video id="video" autoplay playsinline></video>

<div class="controls">
  <button onclick="switchCamera()">🔄 Flip</button>
  <button class="shutter" onclick="takePhoto()"></button>
  <button onclick="stopCamera()">✕</button>
</div>

<canvas id="canvas" hidden></canvas>
<h3>My Photos</h3>
<div id="gallery"></div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const gallery = document.getElementById("gallery");

let stream;
let facing = "environment";

async function startCamera() {
  try {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing },
      audio: false
    });

    video.srcObject = stream;
    await video.play();
  } catch (error) {
    alert("Camera permission is needed. Please allow access.");
  }
}

async function switchCamera() {
  facing = facing === "environment" ? "user" : "environment";
  await startCamera();
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  video.srcObject = null;
}

function takePhoto() {
  if (!stream || !video.videoWidth) return;

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(
    video, 0, 0, canvas.width, canvas.height
  );

  canvas.toBlob(blob => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = "photo-" + Date.now() + ".jpg";
    link.click();

    const img = document.createElement("img");
    img.src = url;
    img.alt = "Captured photo";
    gallery.prepend(img);
  }, "image/jpeg", 0.95);
}

startCamera();
</script>
</body>
</html>
